name: Tests

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "7.4"
          coverage: none

      - name: Lint every PHP file
        run: find upload tests -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Telemetry tests
        run: php tests/run.php
